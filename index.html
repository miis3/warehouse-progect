<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>المستودع التفاعلي</title>
  <script>
    // Branch-based Pages publishes the repository root. Keep the actual app
    // in its existing directory so all relative assets resolve correctly.
    const destination = new URL('./warehouse-project/site/dist/', window.location.href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=./warehouse-project/site/dist/"></noscript>
</head>
<body>
  <a href="./warehouse-project/site/dist/">فتح المستودع التفاعلي</a>
</body>
</html>
