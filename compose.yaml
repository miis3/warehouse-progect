name: warehouse-management

services:
  web:
    build:
      context: .
    image: warehouse-management:local
    restart: unless-stopped
    environment:
      WAREHOUSE_SITE_ADDRESS: ${WAREHOUSE_SITE_ADDRESS:-:80}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
    ports:
      - "${WAREHOUSE_HTTP_PORT:-8080}:80"
      - "${WAREHOUSE_HTTPS_PORT:-8443}:443"
      - "${WAREHOUSE_HTTPS_PORT:-8443}:443/udp"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
